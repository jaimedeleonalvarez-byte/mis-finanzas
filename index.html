<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#F4F6FB">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Finanzas">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>Mis finanzas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F6FB; --card:#FFFFFF; --ink:#0E1630; --ink2:#5B6478; --ink3:#8A93A6; --line:#E7EAF2;
  --blue:#1D55F0; --blue2:#E6EEFF; --teal:#46DFCB; --green:#16935A; --green2:#E3F6EC; --red:#E5484D;
  --r:22px; --sh:0 1px 2px rgba(16,24,64,.04),0 6px 20px rgba(16,24,64,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{touch-action:manipulation;-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
svg,img{-webkit-user-drag:none;pointer-events:none}
html,body{overflow-x:hidden}
input[type=date]{-webkit-appearance:none;appearance:none;min-width:0;display:block;text-align:left;min-height:52px}
.inp{max-width:100%;min-width:0}
input,textarea,select{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default;font-size:16px}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Figtree,system-ui,-apple-system,sans-serif;font-size:16px}
body{padding:env(safe-area-inset-top) 0 0}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:var(--ink)}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{max-width:520px;margin:0 auto;padding:30px 18px calc(120px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;padding:10px 0 6px}
.brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:26px;letter-spacing:-.3px}
.avatar{width:50px;height:50px;border-radius:50%;background:#fff;box-shadow:var(--sh);display:grid;place-items:center;color:#3C4560}
.back{display:flex;align-items:center;gap:6px;font-weight:800;font-size:24px}
.back button{width:40px;height:40px;border-radius:50%;background:#fff;box-shadow:var(--sh);display:grid;place-items:center}
.monthnav{display:flex;justify-content:center;align-items:center;gap:26px;margin:14px 0 4px;font-weight:700;font-size:19px}
.monthnav button{width:36px;height:36px;display:grid;place-items:center;border-radius:50%}
.monthnav span{min-width:170px;text-align:center}
.ring{display:block;padding:0;position:relative;width:min(76vw,300px);aspect-ratio:1;margin:4px auto 14px}
.ring>svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .lbl{color:var(--ink2);font-weight:500;font-size:16px;margin-top:6px}
.ring .big{font-weight:800;font-size:clamp(32px,10vw,44px);letter-spacing:-1.5px;line-height:1.1;margin:4px 0}
.ring .of{color:var(--ink2);font-weight:600;font-size:17px}
.pill{display:inline-block;padding:6px 16px;border-radius:99px;background:var(--green2);color:#0E7A49;font-weight:700;font-size:15px;margin-top:10px}
.pill.warn{background:#FFF1E0;color:#B5600B}.pill.bad{background:#FDECEC;color:#C02A30}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.tile{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);border:1px solid #EEF0F6;padding:14px 8px 14px 12px;display:flex;align-items:center;gap:10px;min-width:0;text-align:left;min-height:96px}
.tile>div:not(.ico){min-width:0}.tile b{display:block;font-size:16.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis}
@media(max-width:440px){.tile{padding:12px 8px 12px 10px;gap:8px}.tile .ico{width:38px;height:38px}.tile .ico svg.i{width:20px;height:20px}.tile .chev{display:none}.tile b{font-size:15px;letter-spacing:-.3px}.tile small{font-size:13px}}
.tile small{display:block;color:var(--ink2);font-size:13.5px;margin-top:3px;line-height:1.25}
.tile .chev{margin-left:auto;color:#B3BACB}
.ico{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;flex:none}
.ico.s{width:42px;height:42px}.ico.s svg.i{width:20px;height:20px}
.sec{display:flex;justify-content:space-between;align-items:center;margin:26px 2px 12px}
.sec h2{font-size:22px;font-weight:800;margin:0;letter-spacing:-.3px}
.link{color:var(--blue);font-weight:700;font-size:16px;display:flex;align-items:center;gap:2px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);border:1px solid #EEF0F6}
.list .row{display:flex;align-items:center;gap:14px;padding:14px 16px;width:100%;text-align:left}
.list .row + .row{border-top:1px solid var(--line)}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t small{display:block;color:var(--ink2);font-size:14.5px;margin-top:2px}
.amt{font-weight:800;font-size:17px;white-space:nowrap}
.amt.pos{color:var(--green)}
.empty{padding:28px 18px;text-align:center;color:var(--ink2);font-size:15px}
.banner{display:flex;align-items:center;gap:12px;background:#FFF6E8;border:1px solid #FBE3BC;color:#8A4B06;border-radius:18px;padding:12px 14px;margin-top:14px;width:100%;text-align:left;font-weight:600;font-size:15px}
.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom));z-index:20}
.nav .w{max-width:520px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 1fr 1fr 1fr;align-items:center}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:13px;font-weight:600;color:#4A5370;padding:8px 0;border-radius:16px}
.nav button.on{background:var(--blue2);color:var(--blue)}
.nav button svg.i{width:26px;height:26px}
.fab{width:66px!important;height:66px;margin:-34px auto 0;border-radius:50%!important;background:var(--blue)!important;color:#fff!important;box-shadow:0 8px 22px rgba(29,85,240,.4),0 0 0 6px #fff;justify-content:center}
.fab svg.i{width:32px!important;height:32px!important;stroke-width:2.4}
.hero{padding:22px 20px;border-radius:26px;background:linear-gradient(135deg,#1D55F0,#2E86F5 55%,#46DFCB);color:#fff;box-shadow:0 10px 30px rgba(29,85,240,.25)}
.hero small{opacity:.85;font-weight:600}
.hero .big{font-size:40px;font-weight:800;letter-spacing:-1px;margin:4px 0}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:99px;background:#fff;border:1px solid var(--line);font-weight:600;font-size:14px}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.bar{height:8px;border-radius:99px;background:#EDF0F6;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;border-radius:99px}
.muted{color:var(--ink2)}
.note{font-size:14px;color:var(--ink2);line-height:1.45}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px;border-radius:16px;background:var(--blue);color:#fff;font-weight:700;font-size:17px}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:#FDECEC;color:#C02A30}
.btn.sm{width:auto;padding:9px 14px;font-size:14.5px;border-radius:12px}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(14,22,48,.35);z-index:40;opacity:0;transition:opacity .2s}
.scrim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--bg);border-radius:26px 26px 0 0;max-height:92vh;overflow:auto;padding:10px 18px calc(22px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .25s ease;max-width:560px;margin:0 auto;overflow-x:hidden;overscroll-behavior:contain;touch-action:pan-y}
.sheet.on{transform:none}
.sheet.kb{top:calc(env(safe-area-inset-top) + 10px);max-height:none;border-radius:22px 22px 0 0}
body.lock{position:fixed;left:0;right:0;overflow:hidden}
.grab{width:42px;height:5px;border-radius:9px;background:#CFD5E2;margin:2px auto 12px}
.sheet h3{margin:0 0 14px;font-size:22px;font-weight:800;display:flex;justify-content:space-between;align-items:center}
.sheet h3 button{width:36px;height:36px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:var(--sh)}
.f{margin-bottom:14px}
.f label{display:block;font-size:13.5px;font-weight:700;color:var(--ink2);margin:0 0 6px 2px;text-transform:uppercase;letter-spacing:.4px}
.inp{width:100%;padding:14px 14px;border-radius:14px;border:1px solid var(--line);background:#fff;font-size:17px;outline:none}
.inp:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(29,85,240,.12)}
textarea.inp{min-height:84px;resize:vertical;font-size:16px}
.money{font-size:30px;font-weight:800;text-align:center}
.seg{display:grid;grid-template-columns:1fr 1fr;background:#E9ECF4;border-radius:14px;padding:4px;margin-bottom:14px}
.seg3{grid-template-columns:1fr 1fr 1fr}
.seg button{padding:10px;border-radius:11px;font-weight:700;color:var(--ink2)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:var(--sh)}
.catgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.catgrid button{min-width:0;overflow-wrap:anywhere;hyphens:auto;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 2px;border-radius:16px;background:#fff;border:2px solid transparent;font-size:12px;font-weight:600;text-align:center;line-height:1.15}
.catgrid button.on{border-color:var(--blue);background:var(--blue2)}
.check{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin:4px 0 14px}
.check input{width:22px;height:22px;accent-color:var(--blue)}
.parsed{font-size:14px;padding:10px 12px;border-radius:12px;background:var(--green2);color:#0E7A49;font-weight:600;margin:-6px 0 14px}
.parsed.no{background:#FFF1E0;color:#8A4B06}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-weight:600;font-size:15px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.kv{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;width:100%;text-align:left}
.kv + .kv{border-top:1px solid var(--line)}
.kv span{font-weight:600}.kv b{font-weight:800}
.acard{display:flex;align-items:center;gap:12px;padding:16px}
.acard .t{flex:1;min-width:0}.acard .t b{display:block;font-size:17.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acard .t small{display:block;color:var(--ink2);font-size:14px;margin-top:2px;white-space:nowrap}
.acard .r{text-align:right;flex:none}.acard .v{font-size:19px;font-weight:800;white-space:nowrap}
.acard .link{font-size:14.5px;margin-left:auto;margin-top:2px;white-space:nowrap}
.status{font-size:12.5px;color:var(--ink3);text-align:center;margin-top:22px}
.steps{margin:0;padding-left:20px;line-height:1.55;font-size:15px}
.steps li{margin-bottom:6px}
code{background:#EDF0F6;padding:1px 6px;border-radius:6px;font-size:14px}
</style>
</head>
<body>
<div id="app"></div>
<nav class="nav"><div class="w" id="nav"></div></nav>
<div id="sheetRoot"></div>
<div class="toast" id="toast"></div>

<script>
/* ---------- iconos ---------- */
const IP={

/* ---------- datos fijos ---------- */

const EXP_CATS=['super','gasolina','restaurantes','transporte','compras','hogar','suscripciones','salud','ocio','otros','traspaso'];
const DEFAULT_RULES=[

const PAL=[['#1464A5','#E4EEF8'],['#E8571C','#FDEDE5'],['#141414','#ECECEC'],['#0E8F86','#E2F6F4'],['#7B4FE0','#F0EAFD'],['#D6457E','#FCEAF2'],['#C2741B','#FBF0E1'],['#2B7FD9','#E7F1FC'],['#16935A','#E3F6EC']];
const DEF_META={bbva:{n:'BBVA',sub:'Cuenta corriente',t:'bank',ci:0,ic:'bank'},bankinter:{n:'Bankinter',sub:'Cuenta corriente',t:'bank',ci:1,ic:'bank'},tr:{n:'Trade Republic',sub:'Efectivo',t:'bank',ci:2,ic:'coins'},myinvestor:{n:'MyInvestor',sub:'Fondos',t:'inv',ci:3,ic:'trend'},magP:{n:'Magallanes',sub:'Personal',t:'inv',ci:4,ic:'user'},magC:{n:'Magallanes',sub:'Conjunta',t:'inv',ci:4,ic:'users',pct:50}};
let ACCS={},INVS={},DEST={};
function ensureMeta(){const c=S.config;c.acc=c.acc||{};c.inv=c.inv||{};
  if(!c.meta){c.meta={};let o=0;for(const k of [...Object.keys(c.acc),...Object.keys(c.inv)]){const d=DEF_META[k]||{n:k,sub:'',t:k in c.acc?'bank':'inv',ci:o%PAL.length,ic:k in c.acc?'bank':'trend'};c.meta[k]={...d,ord:o++};if(k==='magC')c.meta[k].pct=c.pct??50}}
  for(const k of Object.keys(c.acc))if(!c.meta[k])c.meta[k]={n:k,sub:'',t:'bank',ci:0,ic:'bank',ord:99};
  for(const k of Object.keys(c.inv))if(!c.meta[k])c.meta[k]={n:k,sub:'',t:'inv',ci:3,ic:'trend',ord:99};}
function rebuildMeta(){ensureMeta();const c=S.config;ACCS={};INVS={};DEST={};
  Object.entries(c.meta).sort((a,b)=>(a[1].ord||0)-(b[1].ord||0)).forEach(([k,m])=>{const[col,bg]=PAL[(m.ci||0)%PAL.length];const o={n:m.n,sub:m.sub||'',c:col,bg,ic:m.ic||(m.t==='bank'?'bank':'trend'),pct:m.pct??100,t:m.t,del:m.del};
    DEST[k]=m.t==='inv'&&m.sub?m.n+' '+m.sub.toLowerCase():m.n;if(m.del)return;if(m.t==='bank'&&k in c.acc)ACCS[k]=o;else if(m.t==='inv'&&k in c.inv)INVS[k]=o});
  if(!ACCS[c.defAcc])c.defAcc=Object.keys(ACCS)[0]||'';}
const share=k=>(INVS[k]?INVS[k].pct:100)/100;
const FORM_CATS=['super','gasolina','restaurantes','transporte','compras','hogar','suscripciones','salud','ocio','otros'];
const MESES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const MES3=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];

const defConfig=()=>({setup:false,budget:1200,acc:{bbva:0,bankinter:0,tr:0},inv:{myinvestor:0,magP:0,magC:0},pct:50,defAcc:'bbva',rules:[],catBudget:{}});
let S={config:defConfig(),months:{},history:[]};
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const ymNow=()=>today().slice(0,7);

/* ---------- utilidades ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2=n=>Math.round((+n||0)*100)/100;
function fmt(n,sign){n=r2(n);const neg=n<0;let [a,b]=Math.abs(n).toFixed(2).split('.');a=a.replace(/\B(?=(\d{3})+(?!\d))/g,'.');return (neg?'−':(sign&&n>0?'+':''))+a+','+b+' €'}
function fmt0(n){n=Math.round(n);const neg=n<0;return (neg?'−':'')+String(Math.abs(n)).replace(/\B(?=(\d{3})+(?!\d))/g,'.')+' €'}
function num(s){if(typeof s==='number')return s;s=String(s||'').replace(/[^\d,.\-]/g,'');if(!s)return 0;if(s.includes(',')){s=s.replace(/\./g,'').replace(',','.')}else if((s.match(/\./g)||[]).length>1||/\.\d{3}$/.test(s)){s=s.replace(/\./g,'')}return parseFloat(s)||0}
function ymLabel(ym){const[y,m]=ym.split('-');return MESES[+m-1]+' '+y}
function ymAdd(ym,d){let[y,m]=ym.split('-').map(Number);m+=d;while(m<1){m+=12;y--}while(m>12){m-=12;y++}return y+'-'+String(m).padStart(2,'0')}
function dayLabel(d){const t=today();const y=new Date(Date.now()-864e5);const ys=y.getFullYear()+'-'+String(y.getMonth()+1).padStart(2,'0')+'-'+String(y.getDate()).padStart(2,'0');if(d===t)return'Hoy';if(d===ys)return'Ayer';const[,m,dd]=d.split('-');return (+dd)+' '+MES3[+m-1]}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2200)}

/* ---------- cálculos ---------- */
const movs=ym=>(S.months[ym]||[]).slice().sort((a,b)=>b.date.localeCompare(a.date)||(b.ts||0)-(a.ts||0));
const isSpend=m=>m.amount<0&&!(CATS[m.cat]&&CATS[m.cat].noSpend);
const spent=ym=>r2((S.months[ym]||[]).filter(isSpend).reduce((s,m)=>s-m.amount,0));
const income=ym=>r2((S.months[ym]||[]).filter(m=>m.amount>0&&m.cat!=='traspaso').reduce((s,m)=>s+m.amount,0));
function byCat(ym){const o={};(S.months[ym]||[]).filter(isSpend).forEach(m=>{o[m.cat]=(o[m.cat]||0)-m.amount});return o}
function liquidez(){const a=S.config.acc;return r2(Object.keys(ACCS).reduce((s,k)=>s+(a[k]||0),0))}
function inversion(){const v=S.config.inv;return r2(Object.keys(INVS).reduce((s,k)=>s+(v[k]||0)*share(k),0))}
const patrimonio=()=>r2(liquidez()+inversion());
function allMovs(){return Object.values(S.months).flat()}
function pendientes(){return allMovs().filter(m=>m.cat==='sin')}

/* ---------- clasificación y lectura de avisos ---------- */
function categorize(text,isIncome){
  if(isIncome)return'ingreso';
  const t=(text||'').toLowerCase();
  for(const r of S.config.rules){if(r.k&&t.includes(r.k.toLowerCase()))return r.c}
  for(const[c,re]of DEFAULT_RULES){try{if(new RegExp(re,'i').test(t))return c}catch(e){}}
  return'sin';
}
function parseNotif(raw){
  const s=String(raw||'').replace(/\s+/g,' ').trim(); if(!s)return null;
  const out={};
  const m=s.match(/(?:€\s?)(\d{1,3}(?:[.\s]\d{3})*(?:[.,]\d{1,2})?|\d+(?:[.,]\d{1,2})?)|(\d{1,3}(?:\.\d{3})*,\d{1,2}|\d+(?:[.,]\d{1,2})?)\s?(?:€|eur\b|euros)/i);
  if(m)out.amount=num(m[1]||m[2]);
  out.income=/(ingreso|abono|recibid|n[oó]mina|devoluci|reembolso|te han (?:enviado|hecho)|has recibido|te ha llegado|transferencia entrante)/i.test(s);
  if(/bbva/i.test(s))out.acc='bbva';else if(/bankinter/i.test(s))out.acc='bankinter';else if(/trade ?republic/i.test(s))out.acc='tr';
  let mer=null;
  const pats=[/\ben\s+(.+?)(?:\s+con\s+(?:tu|la|su)?\s*tarjeta|\s+con\s+|\s+el\s+d[ií]a|\s+por\s+|\s+·|[,;]|\.(?:\s|$)|$)/i,/comercio:?\s*([^,;.·]+)/i,/(?:de|desde)\s+([A-ZÁÉÍÓÚÑ][^,;.·]{2,40})/];
  for(const p of pats){const x=s.match(p);if(x&&x[1]&&!/^\d/.test(x[1].trim())){mer=x[1].trim();break}}
  if(mer){mer=mer.replace(/\b(bbva|bankinter|trade republic)\b/ig,'').replace(/\s{2,}/g,' ').trim()}
  out.concept=(mer&&mer.length>1?mer:s.replace(m?m[0]:'','').trim()).slice(0,40);
  out.cat=categorize(out.concept+' '+s,out.income);
  return out;
}

let DBC=null,USERID=null,loaded=false,storeNote='Guardado en este dispositivo';
const LS='misfinanzas.v1';
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
function loadLocal(){try{const x=JSON.parse(localStorage.getItem(LS)||'null');if(x&&x.config){S={config:{...defConfig(),...x.config},months:x.months||{},history:x.history||[]}}}catch(e){}}
let wq=Promise.resolve();
function bodyFor(k){if(k==='config')return S.config;if(k==='history')return{items:S.history};return{items:S.months[k.slice(2)]||[]}}
function save(...keys){saveLocal();if(!DBC)return;keys.forEach(k=>{const body=JSON.parse(JSON.stringify(bodyFor(k)));wq=wq.then(()=>DBC.doc(k).set(body)).catch(e=>{toast(e&&e.code==='quota_exceeded'?'Espacio lleno':'No se pudo guardar en la nube')})})}
function applySnapshot(snap){
  if(snap.empty){if(!snap.metadata.fromCache&&S.config.setup){save('config','history',...Object.keys(S.months).map(k=>'m-'+k))}return}
  const n={config:defConfig(),months:{},history:[]};
  snap.docs.forEach(d=>{const b=d.data();if(!b)return;if(d.id==='config')n.config={...defConfig(),...b,acc:b.meta?(b.acc||{}):{...defConfig().acc,...(b.acc||{})},inv:b.meta?(b.inv||{}):{...defConfig().inv,...(b.inv||{})}};else if(d.id==='history')n.history=b.items||[];else if(d.id.startsWith('m-'))n.months[d.id.slice(2)]=b.items||[]});
  S=n;saveLocal();render();
}
async function initStore(){
  if(!window.claude||!window.claude.use){storeNote='Guardado en este dispositivo';return}
  try{
    const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    const id=user?await user.id():null;
    if(!db||!id){storeNote='Guardado en este dispositivo (inicia sesión para guardar en la nube)';render();return}
    DBC=db.collection('data/users/'+id);USERID=id;
    const timer=setTimeout(()=>{storeNote='Sin conexión: mostrando la última copia';render()},10000);
    DBC.onSnapshot(snap=>{if(!snap.metadata.fromCache){clearTimeout(timer);storeNote='Guardado en la nube · privado'}applySnapshot(snap);maybeOnboard()},e=>{clearTimeout(timer);storeNote='No se pudo conectar con la nube';render()});
  }catch(e){storeNote='Guardado en este dispositivo';render()}
}

/* ---------- operaciones ---------- */
function applyBal(m,sign){if(m.nb)return;const A=S.config.acc,V=S.config.inv;if(A[m.acc]!=null)A[m.acc]=r2(A[m.acc]+sign*m.amount);if(m.to){if(A[m.to]!=null)A[m.to]=r2(A[m.to]-sign*m.amount);else if(V[m.to]!=null)V[m.to]=r2(V[m.to]-sign*m.amount)}}
function snapHist(){rebuildMeta();const d=today(),t=patrimonio();const h=S.history;if(h.length&&h[h.length-1].d===d)h[h.length-1].t=t;else h.push({d,t});if(h.length>500)h.splice(0,h.length-500)}
function findMov(id){for(const ym in S.months){const i=S.months[ym].findIndex(m=>m.id===id);if(i>=0)return{ym,i,m:S.months[ym][i]}}return null}
function upsertMov(m){
  const keys=new Set(['config','history']);
  const old=findMov(m.id);
  if(old){applyBal(old.m,-1);S.months[old.ym].splice(old.i,1);keys.add('m-'+old.ym)}
  const ym=m.date.slice(0,7);(S.months[ym]||(S.months[ym]=[])).push(m);keys.add('m-'+ym);
  applyBal(m,1);snapHist();save(...keys);
}
function deleteMov(id){const f=findMov(id);if(!f)return;applyBal(f.m,-1);S.months[f.ym].splice(f.i,1);snapHist();save('m-'+f.ym,'config','history')}
function learnRule(concept,cat){const k=(concept||'').trim().toLowerCase();if(!k||cat==='sin'||cat==='ingreso')return;const r=S.config.rules.find(x=>x.k===k);if(r)r.c=cat;else S.config.rules.push({k,c:cat})}

function movRow(m,ctx){if(m.to){const amtTxt=ctx===m.acc?fmt(m.amount,true):ctx===m.to?fmt(-m.amount,true):'⇄ '+fmt(Math.abs(m.amount));return`<button class="row" data-act="edit" data-id="${m.id}">${catIco('traspaso')}<div class="t"><b>${esc(m.concept||'Traspaso')}</b><small>${dayLabel(m.date)} · ${(ACCS[m.acc]||{}).n||''} → ${DEST[m.to]||''}</small></div><div class="amt" style="color:#3C6BD6">${amtTxt}</div></button>`}const C=CATS[m.cat]||CATS.otros;const acc=ACCS[m.acc]?ACCS[m.acc].n:'';const sub=dayLabel(m.date)+(acc?' · '+(m.amount>0?'Ingreso '+acc:'Tarjeta '+acc):'')+(m.cat==='sin'?' · <span style="color:#B5600B;font-weight:700">Sin clasificar</span>':'');
  return`<button class="row" data-act="edit" data-id="${m.id}">${catIco(m.cat)}<div class="t"><b>${esc(m.concept||C.n)}</b><small>${sub}</small></div><div class="amt ${m.amount>0?'pos':''}">${fmt(m.amount,true)}</div></button>`}

function lineChart(pts){

let baseH=0;
function kbEstimate(){const vv=window.visualViewport;const h=vv?vv.height:window.innerHeight;baseH=Math.max(baseH,h,document.documentElement.clientHeight||0);return Math.max(0,baseH-h)}
const isTextField=el=>el&&/INPUT|TEXTAREA/.test(el.tagName)&&!/checkbox|radio|date/.test(el.type||'');
function fitSheet(forceOpen){const s=document.querySelector('#sheetRoot .sheet');if(!s)return;const a=document.activeElement;const open=forceOpen||(isTextField(a)&&s.contains(a));s.classList.toggle('kb',!!open);s.style.paddingBottom=open?(Math.max(kbEstimate(),(window.screen.height||800)*0.45)+24)+'px':'';if(window.scrollY&&document.body.classList.contains('lock'))window.scrollTo(0,0)}
function keepFocusVisible(){const a=document.activeElement,s=document.querySelector('#sheetRoot .sheet');if(!isTextField(a)||!s||!s.contains(a))return;const r=a.getBoundingClientRect(),sr=s.getBoundingClientRect();const want=sr.top+90;if(Math.abs(r.top-want)>20)s.scrollTop+=r.top-want}
document.addEventListener('pointerdown',e=>{const f=e.target.closest&&e.target.closest('#sheetRoot .sheet input,#sheetRoot .sheet textarea');if(isTextField(f)){fitSheet(true);requestAnimationFrame(keepFocusVisible)}},true);
if(window.visualViewport){visualViewport.addEventListener('resize',()=>{fitSheet();keepFocusVisible()})}
window.addEventListener('orientationchange',()=>{baseH=0});
document.addEventListener('focusin',e=>{if(isTextField(e.target)&&e.target.closest('#sheetRoot .sheet')){fitSheet(true);keepFocusVisible();setTimeout(()=>{fitSheet();keepFocusVisible()},350)}});

        if(nm.cat==='traspaso')nm.cat=type==='in'?'ingreso':'sin';
        if(manualCat&&q('#rem').checked&&q('#remW').style.display!=='none')learnRule(con,nm.cat);
        if(existing&&existing.cat==='sin'&&nm.cat!=='sin')learnRule(con,nm.cat);
      }
      if(!q('#bal').checked)nm.nb=true;else delete nm.nb;
      upsertMov(nm);closeSheet();ui.month=nm.date.slice(0,7);render();
      toast(existing?'Movimiento actualizado':type==='tr'?DEST[nm.acc]+': '+fmt(S.config.acc[nm.acc])+' · '+DEST[nm.to]+': '+fmt(S.config.acc[nm.to]??S.config.inv[nm.to]):(nm.cat==='sin'?'Apuntado · falta la categoría':nm.cat==='ingreso'?'Ingreso apuntado':'Apuntado en '+CATS[nm.cat].n));
    };
    if(q('#delM'))q('#delM').onclick=()=>{const b=q('#delM');if(!b.dataset.sure){b.dataset.sure=1;b.innerHTML=I('trash')+' Pulsa otra vez para borrar';return}deleteMov(m.id);closeSheet();render();toast('Movimiento borrado')};
  });
}
function valueSheet(title,cur,onSave,opts={}){
  openSheet(sh(title)+`${opts.note?`<p class="note" style="margin-top:-6px">${opts.note}</p>`:''}<div class="f"><input class="inp money" id="v" inputmode="decimal" value="${cur!=null&&cur!==''?String(cur).replace('.',','):''}" placeholder="${opts.ph||'0,00 €'}"></div>${opts.extra||''}<button class="btn" id="ok">Guardar</button>`,el=>{
    const i=el.querySelector('#v');
    el.querySelector('#ok').onclick=()=>{onSave(num(i.value),i.value.trim()==='');closeSheet();render()};
  });
}
function onboardSheet(){
  rebuildMeta();const c=S.config;const f=(id,l,v,sub)=>`<div class="f"><label>${esc(l)}${sub?` <span style="text-transform:none;font-weight:500">· ${esc(sub)}</span>`:''}</label><input class="inp" inputmode="decimal" data-k="${id}" value="${v?String(v).replace('.',','):''}" placeholder="0,00 €"></div>`;
  openSheet(sh(c.setup?'Saldos actuales':'¡Bienvenido! 👋')+`${c.setup?'':'<p class="note" style="margin-top:-6px">Escribe lo que tienes hoy en cada sitio. Luego la app irá restando los cobros que apuntes. Puedes añadir o quitar bancos e inversiones en Ajustes.</p>'}
   <div class="f"><label>Presupuesto mensual de gastos</label><input class="inp" inputmode="decimal" id="budget" value="${String(c.budget).replace('.',',')}"></div>
   <div style="font-weight:800;margin:18px 0 10px">Cuentas</div>
   ${Object.entries(ACCS).map(([k,o])=>f('acc.'+k,o.n,c.acc[k],o.sub)).join('')}
   <div style="font-weight:800;margin:18px 0 10px">Inversiones</div>
   ${Object.entries(INVS).map(([k,o])=>f('inv.'+k,o.n,c.inv[k],(o.sub||'')+(o.pct<100?' (valor total)':''))).join('')}
   <button class="btn" id="ok">${c.setup?'Guardar':'Empezar'}</button>`,el=>{
    el.querySelector('#ok').onclick=()=>{c.budget=num(el.querySelector('#budget').value)||c.budget;
      el.querySelectorAll('input[data-k]').forEach(i=>{const[g,k]=i.dataset.k.split('.');c[g][k]=r2(num(i.value))});
      c.setup=true;snapHist();save('config','history');closeSheet();render();toast('Guardado')};
  });
}
function itemSheet(k,t){
  rebuildMeta();const c=S.config;const isNew=!k;const m=isNew?{n:'',sub:'',t,pct:100}:c.meta[k];t=m.t;
  const val=isNew?0:(t==='bank'?c.acc[k]:c.inv[k]);
  openSheet(sh(isNew?(t==='bank'?'Nuevo banco o cuenta':'Nueva inversión'):'Editar '+(t==='bank'?'cuenta':'inversión'))+`
   <div class="f"><label>Nombre</label><input class="inp" id="in" placeholder="${t==='bank'?'Ej: ING':'Ej: Indexa Capital'}" value="${esc(m.n)}"></div>
   <div class="f"><label>Detalle (opcional)</label><input class="inp" id="is" placeholder="${t==='bank'?'Ej: Cuenta nómina':'Ej: Fondo indexado, Conjunta…'}" value="${esc(m.sub||'')}"></div>
   <div class="f"><label>${t==='bank'?'Saldo actual':'Valor actual'}${t==='inv'?' <span style="text-transform:none;font-weight:500">· total de la cuenta</span>':''}</label><input class="inp" id="iv" inputmode="decimal" placeholder="0,00 €" value="${val?String(val).replace('.',','):''}"></div>
   ${t==='inv'?`<div class="f"><label>Tu parte (%)</label><input class="inp" id="ip" inputmode="numeric" value="${m.pct??100}"><p class="note" style="margin:6px 2px 0">Pon 100 si es solo tuya. Si es conjunta, pon tu porcentaje (por ejemplo, 50).</p></div>`:''}
   <button class="btn" id="ok">Guardar</button>
   ${isNew?'':`<button class="btn danger" id="del" style="margin-top:10px">${I('trash')} Borrar ${t==='bank'?'cuenta':'inversión'}</button>`}`,el=>{
    const q=s=>el.querySelector(s);
    q('#ok').onclick=()=>{const n=q('#in').value.trim();if(!n){toast('Escribe un nombre');return}
      let key=k;if(isNew){key='x'+uid();const used=Object.values(c.meta).filter(x=>!x.del).length;c.meta[key]={t,ic:t==='bank'?'bank':'trend',ci:used%PAL.length,ord:Date.now()}}
      const mm=c.meta[key];mm.n=n;mm.sub=q('#is').value.trim();
      if(t==='inv'){mm.pct=Math.max(1,Math.min(100,num(q('#ip').value)||100));mm.ic=mm.pct<100?'users':(mm.ic==='users'?'trend':mm.ic)}
      (t==='bank'?c.acc:c.inv)[key]=r2(num(q('#iv').value));
      if(t==='bank'&&!ACCS[c.defAcc])c.defAcc=key;
      snapHist();save('config','history');closeSheet();render();toast(isNew?'Añadido':'Guardado')};
    if(q('#del'))q('#del').onclick=()=>{const b=q('#del');
      if(t==='bank'&&Object.keys(ACCS).length<=1){toast('Necesitas al menos una cuenta');return}
      if(!b.dataset.sure){b.dataset.sure=1;b.innerHTML=I('trash')+' Pulsa otra vez para borrar';if(val)toast('Su saldo ('+fmt(val)+') dejará de contar en tu patrimonio');return}
      c.meta[k].del=true;delete (t==='bank'?c.acc:c.inv)[k];if(c.defAcc===k)c.defAcc='';
      snapHist();save('config','history');closeSheet();render();toast('Borrado. Sus movimientos anteriores se conservan.')};
  });
}
/* ---------- eventos ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,d=b.dataset;
  switch(a){
   case'go':ui.view=d.v;closeSheet(true);lockBody(false);render();window.scrollTo(0,0);break;
   case'mprev':ui.month=ymAdd(ui.month,-1);render();break;
   case'mnext':ui.month=ymAdd(ui.month,1);render();break;
   case'banktab':ui.bankTab=d.t;render();break;
   case'accf':ui.accFilter=d.k;render();break;
   case'add':movSheet();break;
   case'close':closeSheet();break;
   case'edit':{const f=findMov(d.id);if(f)movSheet(f.m);break}
   case'quickcat':{const f=findMov(d.id);if(!f)break;const nm={...f.m,cat:d.c};if($('#remember')?.checked)learnRule(nm.concept,d.c);upsertMov(nm);render();toast(CATS[d.c].n);break}
   case'catdetail':{const list=movs(ui.month).filter(m=>m.cat===d.c&&isSpend(m));openSheet(sh(CATS[d.c].n+' · '+ymLabel(ui.month))+`<div class="card list">${list.map(movRow).join('')||'<div class="empty">Nada</div>'}</div>`);break}
   case'editbudget':{const c=d.c;if(!c)valueSheet('Presupuesto mensual',S.config.budget,v=>{S.config.budget=r2(v);save('config')});else valueSheet('Límite · '+CATS[c].n,S.config.catBudget[c]||'',(v,empty)=>{if(empty||!v)delete S.config.catBudget[c];else S.config.catBudget[c]=r2(v);save('config')},{note:'Déjalo vacío para quitar el límite.',ph:'Sin límite'});break}
   case'editval':{const[g,k]=d.path.split('.');const isAcc=g==='acc';valueSheet((isAcc?'Saldo real · ':'Valor actual · ')+d.n,S.config[g][k],v=>{S.config[g][k]=r2(v);snapHist();save('config','history');toast('Actualizado')},{note:isAcc?'Escribe el saldo que ves ahora en la app del banco. A partir de aquí se irán restando los cobros.':'Escribe el valor de hoy (lo ves en la app de la gestora).'});break}
   case'updinv':onboardSheet();break;
   case'onboard':onboardSheet();break;
   case'additem':itemSheet(null,d.t);break;
   case'edititem':itemSheet(d.k);break;
   case'editpct':valueSheet('Mi parte de la conjunta (%)',S.config.pct,v=>{S.config.pct=Math.max(0,Math.min(100,v));snapHist();save('config','history')},{ph:'50',note:'Qué porcentaje de la cuenta conjunta de Magallanes es tuyo. Solo esa parte cuenta en tu patrimonio.'});break;
   case'defacc':openSheet(sh('Cuenta por defecto')+`<div class="card list">${Object.entries(ACCS).map(([k,A])=>`<button class="row" data-act="setdef" data-k="${k}"><div class="ico s" style="background:${A.bg};color:${A.c}">${I('bank')}</div><div class="t"><b>${A.n}</b></div>${S.config.defAcc===k?'✓':''}</button>`).join('')}</div>`);break;
   case'setdef':S.config.defAcc=d.k;save('config');closeSheet();render();break;
   case'addrule':openSheet(sh('Nueva regla')+`<p class="note" style="margin-top:-6px">Si el concepto del cobro contiene esta palabra, se clasificará en la categoría elegida.</p><div class="f"><label>Palabra</label><input class="inp" id="rk" placeholder="Ej: gimnasio pepe"></div><div class="f"><label>Categoría</label><div class="catgrid" id="rc">${EXP_CATS.map(c=>`<button data-c="${c}">${catIco(c,1)}${CATS[c].n}</button>`).join('')}</div></div><button class="btn" id="ok">Guardar regla</button>`,el=>{let c=null;el.querySelector('#rc').onclick=ev=>{const x=ev.target.closest('button');if(!x)return;c=x.dataset.c;el.querySelectorAll('#rc button').forEach(y=>y.classList.toggle('on',y===x))};el.querySelector('#ok').onclick=()=>{const k=el.querySelector('#rk').value.trim();if(!k||!c){toast('Escribe la palabra y elige categoría');return}learnRule(k,c);save('config');closeSheet();render()}});break;
   case'delrule':S.config.rules.splice(+d.i,1);save('config');render();break;
   case'export':{const t=JSON.stringify(S);navigator.clipboard.writeText(t).then(()=>toast('Datos copiados. Pégalos en una nota para guardarlos.'),()=>openSheet(sh('Copia de seguridad')+`<textarea class="inp" style="min-height:200px">${esc(t)}</textarea>`));break}
   case'import':openSheet(sh('Restaurar copia')+`<p class="note" style="margin-top:-6px">Pega aquí una copia de seguridad. Reemplazará todos los datos actuales.</p><textarea class="inp" id="imp" style="min-height:160px"></textarea><button class="btn" id="ok" style="margin-top:12px">Restaurar</button>`,el=>{el.querySelector('#ok').onclick=()=>{try{const x=JSON.parse(el.querySelector('#imp').value);if(!x.config)throw 0;const oldKeys=Object.keys(S.months);S={config:{...defConfig(),...x.config},months:x.months||{},history:x.history||[]};save('config','history',...new Set([...oldKeys,...Object.keys(S.months)].map(k=>'m-'+k)));closeSheet();render();toast('Datos restaurados')}catch(e){toast('El texto no es una copia válida')}}});break;
  }
});

/* ---------- sin zoom ni menú al mantener pulsado ---------- */
const isField=t=>t&&t.closest&&t.closest('input,textarea,select');
document.addEventListener('contextmenu',e=>{if(!isField(e.target))e.preventDefault()});
document.addEventListener('selectstart',e=>{if(!isField(e.target))e.preventDefault()});
document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});
['gesturestart','gesturechange','gestureend'].forEach(n=>document.addEventListener(n,e=>e.preventDefault(),{passive:false}));
document.addEventListener('touchmove',e=>{if(e.touches.length>1)e.preventDefault()},{passive:false});
let lastTouch=0;document.addEventListener('touchend',e=>{const n=Date.now();if(n-lastTouch<300&&!isField(e.target)){e.preventDefault();const b=e.target.closest('[data-act],button');b&&b.click()}lastTouch=n},{passive:false});

/* ---------- arranque ---------- */
let onboarded=false;
function maybeOnboard(){if(onboarded)return;onboarded=true;if(location.hash==='#nuevo'){movSheet();return}if(!S.config.setup)onboardSheet()}
window.addEventListener('hashchange',()=>{if(location.hash==='#nuevo')movSheet()});
loadLocal();render();initStore();
if('serviceWorker' in navigator&&location.protocol==='https:'&&!location.hostname.endsWith('claude.ai')){navigator.serviceWorker.register('sw.js').catch(()=>{})}
setTimeout(()=>{if(!DBC)maybeOnboard()},window.claude?3500:300);
</script>
